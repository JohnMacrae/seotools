<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword targets</title>
<style>
  :root { --accent-bg: #fff3a8; --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec; --accent: #2f6fde; --bad: #d64545; --radius: 10px;
    --on-accent: #fff; --bad-bg: #fdeaea; --bad-line: #f3c2c2; --bad-ink: #8a1f1f; --subtle: #eef0f4;
    color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --card: #1b2029; --ink: #e4e7ee; --muted: #9aa3b5; --line: #2c3340; --accent: #6b9cf0; --bad: #f07171; --on-accent: #0b1220; --bad-bg: #3a1f22; --bad-line: #5c2a2e; --bad-ink: #f3b0b0; --subtle: #252b36; --accent-bg: #1f2c45;  } }

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .top { display: flex; gap: 18px; align-items: center; }
  .top h1 { font-size: 16px; margin: 0; }
  nav a { color: var(--muted); margin-right: 14px; text-decoration: none; } nav a.on { color: var(--ink); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; overflow-x: auto; }
  input, button, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--card); color: var(--ink); }
  button { background: var(--accent); color: var(--on-accent); border-color: var(--accent); cursor: pointer; }
  button.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  button.del { background: var(--card); color: var(--bad); border-color: var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td input, td textarea { width: 100%; } td textarea { height: 64px; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .err { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { background: var(--card); color: var(--ink); border-color: var(--line); } .tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .strip { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); white-space: nowrap; font-weight: 400; }
  .lm h3 { margin: 0 0 4px; font-size: 14px; } .lm p { margin: 4px 0; }
  .lm summary { cursor: pointer; color: var(--muted); margin: 8px 0 4px; }
  .st-done { color: #2e8b57; } .st-bad { color: var(--bad); } .st-existing { color: var(--muted); }
  th.sort { cursor: pointer; }
  mark { background: var(--accent-bg, #fff3a8); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .sup { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .sup li { margin: 6px 0; } .sup .btns { white-space: nowrap; }
  .sup button { padding: 2px 8px; font-size: 12px; }
  code { background: var(--subtle); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>SEO tools</h1><nav><a href="./">Domain overview</a><a href="compare">Competitor gap</a><a href="linking">Internal linking</a><a href="targets" class="on">Keyword targets</a><a href="mappack">Map pack</a></nav></div>
</header>
<main>
  <div id="err"></div>
  <div class="tabs"><button id="tab_t" class="on">Targets</button><button id="tab_l">Link map</button></div>
  <div id="lm" hidden></div>
  <div class="card" id="targets">
    <div class="bar">
      <button id="seed">Seed from doc</button>
      <button id="add" class="ghost">Add target</button>
      <span class="sub" id="msg">Curated, not inferred (ADR 0001). Seeding refreshes untouched rows and keeps rows you have edited.</span>
    </div>
    <table id="t"></table>
  </div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let rows = [], editing = null;
const TIPS = {
  "#": "Row key from docs/keyword-targets.md.",
  "Target page": "Page meant to rank; \"(new)\" = not built yet.",
  "Primary keyword": "Main keyword the page should rank for.",
  "Supporting keywords": "Related keywords the same page should also cover.",
  "Volume": "Monthly searches for the primary keyword (from the targets doc).",
  "Win basis": "What counts as winning this keyword; \"(edited)\" = changed here.",
  "Phase": "Rollout phase (1 = bridal now).",
  "Line": "Product line: bridal, bridesmaids or MOB.",
  "From": "Supporting page that carries the link (click to sort).",
  "Anchor": "Live link text on the supporting page (click to sort).",
  "Planned anchor": "Anchor the link plan asked for; blank if the link is not in the plan.",
  "Status": "Plan progress: done, wrong anchor, partial, missing; \"existing\" = live link not in the plan.",
  "To": "Page the planned link points at."
};
const tip = k => TIPS[k] ? ` title="${esc(TIPS[k])}"` : "";

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}
const wrap = fn => async (...a) => { try { document.getElementById("err").innerHTML = ""; await fn(...a); } catch (e) { document.getElementById("err").innerHTML = `<div class="err">${esc(e.message)}</div>`; } };

async function load() { rows = await api("GET", "/api/targets"); render(); }

function render() {
  const head = `<tr><th${tip("#")}>#</th><th${tip("Target page")}>Target page</th><th${tip("Primary keyword")}>Primary keyword</th><th${tip("Supporting keywords")}>Supporting keywords</th><th${tip("Volume")}>Volume</th><th${tip("Win basis")}>Win basis</th><th${tip("Phase")}>Phase</th><th${tip("Line")}>Line</th><th></th></tr>`;
  const body = rows.map(r => editing === r.id ? editRow(r) : `<tr>
    <td>${r.seed_key ?? ""}</td><td><code>${esc(r.path)}</code>${r.is_new ? ' <span class="sub">(new)</span>' : ""}</td>
    <td>${esc(r.primary_keyword)}</td><td>${esc(r.supporting.join("; "))}</td>
    <td>${r.volume == null ? "" : r.volume.toLocaleString()}</td><td>${esc(r.win_basis)}${r.edited ? ' <span class="sub">(edited)</span>' : ""}</td>
    <td>${r.phase}</td><td>${esc(r.product_line)}</td>
    <td><button class="ghost" onclick="edit(${r.id})">Edit</button> <button class="del" onclick="del(${r.id})">Delete</button></td></tr>`).join("");
  document.getElementById("t").innerHTML = head + (editing === 0 ? editRow({id: 0, path: "", primary_keyword: "", supporting: [], volume: "", win_basis: "", phase: 1, product_line: "bridal", is_new: 0}) : "") + body;
}
function editRow(r) {
  return `<tr><td></td><td><input id="f_path" value="${esc(r.path)}"><label class="sub"><input type="checkbox" id="f_new" style="width:auto" ${r.is_new ? "checked" : ""}> new page</label></td>
    <td><input id="f_primary_keyword" value="${esc(r.primary_keyword)}"></td>
    <td><textarea id="f_supporting" title="one per line">${esc(r.supporting.join("\n"))}</textarea></td>
    <td><input id="f_volume" type="number" value="${esc(r.volume)}"></td><td><input id="f_win_basis" value="${esc(r.win_basis)}"></td>
    <td><input id="f_phase" type="number" value="${r.phase}" style="width:60px"></td><td><input id="f_product_line" value="${esc(r.product_line)}"></td>
    <td><button onclick="save(${r.id})">Save</button> <button class="ghost" onclick="editing=null;render()">Cancel</button></td></tr>`;
}
const v = id => document.getElementById("f_" + id).value;
window.edit = id => { editing = id; render(); };
window.save = wrap(async id => {
  const body = {path: v("path").trim(), primary_keyword: v("primary_keyword").trim(),
    supporting: v("supporting").split("\n").map(s => s.trim()).filter(Boolean),
    volume: v("volume") === "" ? null : Number(v("volume")), win_basis: v("win_basis"),
    phase: Number(v("phase")) || 1, product_line: v("product_line") || "bridal", is_new: document.getElementById("f_new").checked ? 1 : 0};
  await (id ? api("PUT", `/api/targets/${id}`, body) : api("POST", "/api/targets", body));
  editing = null; await load();
});
window.del = wrap(async id => { if (confirm("Delete this target?")) { await api("DELETE", `/api/targets/${id}`); await load(); } });
document.getElementById("add").onclick = () => { editing = 0; render(); };
document.getElementById("seed").onclick = wrap(async () => {
  const r = await api("POST", "/api/targets/seed");
  document.getElementById("msg").textContent = `Seeded: ${r.added} added, ${r.updated} refreshed, ${r.kept_edited} kept (edited).`;
  await load();
});

// ---- Link map ----
let LM = null, lmSort = {};
const FLAG_TIPS = {"needs links": "Fewer than 3 supporting pages link to this target page in body copy.",
  "anchor monotony": "More than 60% of the contextual anchors are the identical phrase.",
  "anchor conflict": "A link to this page uses another target's keyword and none of its own.",
  "wrong page ranking": "Google ranks a different page of ours for these keywords.",
  "not in plan": "The link plan has no suggestion pointing at this target page.",
  "no supporting pages": "No supporting page has been approved for this target page yet."};
const pos = p => p == null ? "n/a" : p.toFixed(1);
const short = u => { try { const x = new URL(u); return x.pathname + x.search || "/"; } catch (e) { return u; } };
const a = u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(short(u))}</a>`;
const stCls = s => s === "done" ? "st-done" : s === "existing" ? "st-existing" : "st-bad";
function sortRows(id, rows, cols) {
  const s = lmSort[id]; if (!s) return rows;
  return [...rows].sort((x, y) => String(x[cols[s.i]] ?? "").localeCompare(String(y[cols[s.i]] ?? "")) * s.d);
}
function lmTable(id, rows, heads, cols, cell) {
  const th = heads.map((h, i) => `<th class="sort"${tip(h)} onclick="lmSortBy('${id}',${i})">${esc(h)}</th>`).join("");
  return `<table><tr>${th}</tr>${sortRows(id, rows, cols).map(cell).join("")}</table>`;
}
window.lmSortBy = (id, i) => { const s = lmSort[id]; lmSort[id] = {i, d: s && s.i === i ? -s.d : 1}; renderLM(); };
const hl = (sentence, anchor) => {
  const t = String(sentence ?? ""), i = anchor ? t.toLowerCase().indexOf(String(anchor).toLowerCase()) : -1;
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + anchor.length)) + "</mark>" + esc(t.slice(i + anchor.length));
};
window.supDecide = wrap(async (id, status) => {
  const r = await api("POST", `/api/supporting/${id}`, {status});
  for (const e of LM.entries) {
    const i = e.supporting.findIndex(x => x.id === id);
    if (i < 0) continue;
    if (status === "rejected") e.supporting.splice(i, 1); else e.supporting[i] = r;
    e.supporting_approved = e.supporting.filter(x => x.status === "approved").length;
    const bridal = (e.product_line ?? "bridal") === "bridal", has = e.flags.includes("no supporting pages");
    if (!e.supporting_approved && bridal && !has) e.flags.push("no supporting pages");
    if (e.supporting_approved && has) e.flags = e.flags.filter(f => f !== "no supporting pages");
  }
  renderLM();
});
function supSection(e) {
  const ap = e.supporting.filter(x => x.status === "approved"), pr = e.supporting.filter(x => x.status === "proposed");
  const item = (x, btns) => `<li>${a(x.supporting_page)} &mdash; <span class="sub">${x.in_text ? "existing sentence" : "drafted sentence"}</span>
    <div>${hl(x.sentence, x.anchor)}</div><div class="sub">Anchor: ${esc(x.anchor)}${x.reason ? " &middot; " + esc(x.reason) : ""}</div>
    <span class="btns">${btns}</span></li>`;
  const approved = ap.map(x => item(x, `<button class="ghost" onclick="supDecide(${x.id},'proposed')">Undo</button>`)).join("");
  const proposed = pr.map(x => item(x, `<button onclick="supDecide(${x.id},'approved')">Approve</button> <button class="del" onclick="supDecide(${x.id},'rejected')">Reject</button>`)).join("");
  return `<div class="sup"><b>Supporting pages</b> <span class="sub">(${ap.length} approved, ${pr.length} proposed)</span>
    ${ap.length ? `<p class="sub">Approved</p><ul>${approved}</ul>` : ""}${pr.length ? `<p class="sub">Proposed</p><ul>${proposed}</ul>` : ""}
    ${ap.length || pr.length ? "" : '<p class="sub">None yet. Run the supporting-page review.</p>'}</div>`;
}
function card(e) {
  const flags = e.flags.map(f => `<span class="chip" title="${esc(FLAG_TIPS[f] || "")}">${esc(f)}</span>`).join("");
  const id = "c" + e.target_page;
  let gscLine = `GSC position: target page ${pos(e.gsc_target_page_position)}`;
  if (e.wrong_page) gscLine += ` &middot; top page ${a(e.gsc_top_page)} at ${pos(e.gsc_top_page_position)}`;
  const ctx = e.contextual.length ? lmTable(id, e.contextual, ["From", "Anchor", "Planned anchor", "Status"],
    ["src", "anchor", "planned_anchor", "status"],
    c => `<tr><td>${a(c.src)}</td><td>${esc(c.anchor)}</td><td>${esc(c.planned_anchor ?? "")}</td><td class="${stCls(c.status)}">${esc(c.status)}</td></tr>`)
    : `<p class="sub">No contextual links in.</p>`;
  const todo = e.planned_missing.length ? `<details><summary>${e.planned_missing.length} planned link${e.planned_missing.length === 1 ? "" : "s"} not live</summary>
    <table><tr><th${tip("From")}>From</th><th${tip("Planned anchor")}>Planned anchor</th><th${tip("Status")}>Status</th></tr>${e.planned_missing.map(m =>
    `<tr><td>${a(m.src)}</td><td>${esc(m.planned_anchor ?? "")}</td><td class="st-bad">${esc(m.status)}</td></tr>`).join("")}</table></details>` : "";
  const tpl = e.template.length ? `<p class="sub">Template links: ${e.template.map(t => `${esc(t.anchor)} &times;${t.src_count}`).join(", ")}</p>` : "";
  const conf = e.conflicts.length ? `<p class="sub"><b>Anchor conflicts:</b></p><ul class="sub">${e.conflicts.map(c =>
    `<li>${a(c.src)}: "${esc(c.anchor)}" contains "${esc(c.keyword)}" (target #${esc(c.other_target_id)})${c.count > 1 ? ` &times;${c.count}` : ""}</li>`).join("")}</ul>` : "";
  return `<div class="card lm"><h3>${esc(e.keywords.join("; "))} &rarr; ${a(e.target_page)}${flags}</h3>
    <p class="sub">${esc(e.product_line ?? "")} &middot; crawl ${esc(e.crawl_status)} &middot; ${gscLine}</p>${ctx}${todo}${tpl}${conf}${supSection(e)}</div>`;
}
const supBusy = () => LM.supporting_run && LM.supporting_run.status === "running";
const supStatus = () => { const r = LM.supporting_run; if (!r) return "No review run yet.";
  return r.status === "running" ? `Running: ${r.progress ?? ""}` : r.status === "error" ? `Last run failed: ${r.error}` : `Last run done, cost $${(r.cost ?? 0).toFixed(3)}.`; };
let supTimer = null;
function pollSup(id) {
  clearTimeout(supTimer);
  supTimer = setTimeout(wrap(async () => {
    const r = await api("GET", `/api/supporting/run/${id}`);
    LM.supporting_run = r;
    if (r.status === "running") { const m = document.getElementById("supmsg"); if (m) m.textContent = supStatus(); pollSup(id); return; }
    supTimer = null;
    LM = await api("GET", "/api/linkmap?crawl=" + LM.crawl_id);
    renderLM();
  }), 2000);
}
function renderLM() {
  const d = LM, el = document.getElementById("lm"), s = d.summary, c = d.plan_counts;
  const stat = (n, l) => `<div class="stat"><b>${esc(n)}</b><span>${esc(l)}</span></div>`;
  const noPlan = d.plan_id == null;
  el.innerHTML = `<div class="strip">${stat(s.targets, "targets")}${stat(s.needs_links, "need links")}${stat(s.conflicts, "with conflicts")}
    ${stat(s.no_supporting, "no supporting pages")}${stat(s.wrong_page, "wrong page")}${stat(noPlan ? "no plan" : `${c.done}/${d.plan_total}`, "plan done")}</div>
    <p class="sub">Crawl ${esc(d.crawl_id)} &middot; plan ${esc(d.plan_id ?? "none")} (checked on crawl ${esc(d.checked_crawl_id ?? "n/a")}) &middot; Search Console ${d.gsc ? esc(d.gsc.start_date) + " to " + esc(d.gsc.end_date) : "not fetched"}</p>
    <div class="bar"><button id="runsup"${supBusy() ? " disabled" : ""}>Run supporting-page review</button>
      <span class="sub" id="supmsg">${esc(supStatus())}</span></div>
    ${d.entries.map(card).join("")}
    <div class="card"><details><summary>Other links (${d.other_links.length}): planned links to pages that are not target pages</summary>
    ${d.other_links.length ? `<table><tr><th${tip("From")}>From</th><th${tip("To")}>To</th><th${tip("Planned anchor")}>Planned anchor</th><th${tip("Status")}>Status</th></tr>${d.other_links.map(o =>
      `<tr><td>${a(o.src)}</td><td>${a(o.dst)}</td><td>${esc(o.planned_anchor ?? "")}</td><td class="${stCls(o.status)}">${esc(o.status)}</td></tr>`).join("")}</table>` : '<p class="sub">None.</p>'}
    </details></div>`;
  document.getElementById("runsup").onclick = wrap(async () => {
    const r = await api("POST", `/api/crawl/${d.crawl_id}/supporting`);
    LM.supporting_run = {id: r.id, status: "running", progress: "Starting"}; renderLM(); pollSup(r.id);
  });
  if (supBusy() && !supTimer) pollSup(LM.supporting_run.id);
}
const showTab = lm => {
  document.getElementById("lm").hidden = !lm; document.getElementById("targets").hidden = lm;
  document.getElementById("tab_l").classList.toggle("on", lm); document.getElementById("tab_t").classList.toggle("on", !lm);
};
document.getElementById("tab_t").onclick = () => showTab(false);
document.getElementById("tab_l").onclick = wrap(async () => {
  showTab(true);
  if (!LM) { document.getElementById("lm").innerHTML = '<p class="sub">Loading...</p>'; LM = await api("GET", "/api/linkmap"); }
  renderLM();
});
wrap(load)();
</script>
</body>
</html>
