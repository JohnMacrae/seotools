<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { --good: #2e8b57; --accent-bg: #fff3a8; --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec; --accent: #2f6fde; --bad: #d64545; --warn: #e3742f; --radius: 10px;
    --on-accent: #fff; --bad-bg: #fdeaea; --bad-line: #f3c2c2; --bad-ink: #8a1f1f; --subtle: #eef0f4;
    color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --good: #4cc485; --bg: #12151c; --card: #1b2029; --ink: #e4e7ee; --muted: #9aa3b5; --line: #2c3340; --accent: #6b9cf0; --bad: #f07171; --warn: #f0a060; --on-accent: #0b1220; --bad-bg: #3a1f22; --bad-line: #5c2a2e; --bad-ink: #f3b0b0; --subtle: #252b36; --accent-bg: #1f2c45;  } }

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .top { display: flex; gap: 18px; align-items: center; }
  .top h1 { font-size: 16px; margin: 0; }
  nav a { color: var(--muted); margin-right: 14px; text-decoration: none; } nav a.on { color: var(--ink); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; overflow-x: auto; }
  input, button { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--card); color: var(--ink); }
  button { background: var(--accent); color: var(--on-accent); border-color: var(--accent); cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .err { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  code { background: var(--subtle); padding: 0 4px; border-radius: 4px; }
  h2 { font-size: 15px; margin: 0 0 6px; }

  button.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  .strip { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
  h3 { font-size: 14px; margin: 14px 0 4px; }
  .chart { position: relative; height: 280px; }
  .kind { white-space: nowrap; } .kind label { margin-left: 6px; }
  .up { color: var(--good); font-weight: 600; } .down { color: var(--bad); font-weight: 600; } .flat { color: var(--muted); }
  th.sort { cursor: pointer; } th.sort.on { color: var(--ink); }
  td.n, th.n { text-align: right; }
  .lbl { display: inline-block; font-size: 11px; padding: 0 6px; margin: 0 4px 2px 0; border-radius: 8px; background: var(--subtle); color: var(--muted); }
  .off { color: var(--bad); }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="top"><h1>SEO tools</h1><nav><a href="./">Domain overview</a><a href="compare">Competitor gap</a><a href="linking">Internal linking</a><a href="rankings" class="on">Rankings</a><a href="journal">Journal</a><a href="targets">Keyword targets</a><a href="mappack">Map pack</a><a href="digest">Digest</a></nav></div>
</header>
<main>
  <div id="err"></div>
  <div class="bar">
    <label>Range <select id="range"></select></label>
    <label id="grpwrap">Interval <select id="grouping"></select></label>
    <label>Show <select id="mv"><option value="all">All movement</option><option value="up">Moved up</option><option value="down">Moved down</option></select></label>
    <label>Sort <select id="sort">
      <option value="moved">Most moved</option><option value="top">Top ranks</option>
      <option value="volume">Ads volume</option><option value="clicks">Clicks</option></select></label>
    <button id="fetchcs" class="ghost">Fetch clickstream (paid)</button><span class="spend-light" data-feature="clickstream"></span><span class="sub" id="csmsg"></span>
  </div>
  <div class="bar" id="lblwrap"></div>
  <div class="sub" id="note" style="margin-bottom:10px"></div>
  <div class="card"><h2 style="margin:0 0 6px;font-size:15px">Average position of the targets <span class="sub">(lower is better; gaps = no data)</span></h2>
    <div class="chart"><canvas id="ov"></canvas></div></div>
  <div class="sub" id="ovnote"></div>
  <div class="card"><div id="tbl"></div></div>
  <div class="card" id="detail" hidden></div>
</main>
<script src="spendlight.js"></script>
<script src="sitemenu.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const PRESETS = {all:"All data","12m":"12 months","6m":"6 months","3m":"3 months","30d":"30 days","12w":"12 weeks","7d":"7 days"};
const state = {range: "3m", grouping: null, movement: "all", sort: "moved", labels: new Set(), data: null, volumeSource: "Google Ads UK monthly, keyword targets doc"};
let chart = null;
const csDate = () => { const f = state.data && state.data.clickstream && state.data.clickstream.fetched_at; return f ? f.slice(0, 10) : "not fetched"; };
function csLabel(cs) {
  cs = cs || (state.data && state.data.clickstream) || {};
  return (cs.source || "DataForSEO clickstream") + (cs.fetched_at ? ", oldest fetch " + cs.fetched_at.slice(0, 10) : ", not fetched yet");
}
const getJSON = async (url, opts) => {
  const r = await fetch(url, opts), j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `${r.status}`);
  return j;
};
$("fetchcs").onclick = async () => {
  let e;
  try { e = await getJSON("api/clickstream/estimate"); }
  catch (err) { showError(`Clickstream estimate failed: ${err.message}`); return; }
  if (!e.keywords) { $("csmsg").textContent = "Nothing to fetch: all " + e.cached + " keywords cached (30 days)."; return; }
  if (!confirm(`Fetch clickstream volume for ${e.keywords} keywords (${e.cached} cached)?\nEstimated cost: $${e.cost.toFixed(4)}`)) return;
  $("csmsg").textContent = "Fetching\u2026";
  let j;
  try { j = await getJSON("api/clickstream", {method: "POST"}); }
  catch (err) { $("csmsg").textContent = ""; showError(`Clickstream fetch failed: ${err.message}`); return; }
  $("csmsg").textContent = `Fetched ${j.fetched} keywords, cost $${j.cost.toFixed(4)}.`;
  window.spendLights && window.spendLights.refresh();
  load();
};
const pos = n => n == null ? "–" : n.toFixed(1);
const kindOf = label => label.split(":")[0];
// Shown without the kind; the folder label stays a filter but is left out of the table, which already shows the path.
const labelValue = label => label.slice(kindOf(label).length + 1);

function query() {
  const p = new URLSearchParams({range: state.range, movement: state.movement});
  if (state.grouping) p.set("grouping", state.grouping);
  state.labels.forEach(l => p.append("labels", l));
  return p;
}
const num = v => v == null ? "\u2013" : v.toLocaleString();  // missing shows as missing, never 0
function showError(msg) { $("err").innerHTML = `<div class="err">${esc(msg)}</div>`; }
async function loadVolumeSource() {
  // ADR 0002: the Ads volume figure is labelled with its source and date (the targets doc's as-of).
  try {
    const m = await (await fetch("api/targets/meta")).json();
    if (m.doc_mtime) state.volumeSource = `Google Ads UK monthly, keyword targets doc as of ${m.doc_mtime.slice(0, 10)}`;
  } catch {}
}
async function load() {
  $("err").innerHTML = "";
  try {
    const r = await fetch("api/rankings?" + query());
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { showError(j.detail || `Rankings failed (${r.status})`); return; }
    state.data = j; state.grouping = j.grouping; draw();
    if (dcur != null && !$("detail").hidden) openDetail(dcur, false);  // keep an open detail on the same range
  } catch (e) { showError(`Rankings failed to load: ${e.message}`); }
}
function arrow(row) {
  if (row.direction == null) return `<span class="flat">–</span>`;
  if (row.direction === "flat") return `<span class="flat">→ 0.0</span>`;
  // movement = start - current: positive means the position number fell, which is better.
  const up = row.direction === "up";
  return `<span class="${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(row.movement).toFixed(1)}</span>`;
}
const SORT_KEYS = {  // larger sorts first; rows without a value go last
  moved: r => r.movement == null ? -Infinity : Math.abs(r.movement),
  top: r => r.current == null ? -Infinity : -r.current,
  volume: r => r.volume ?? -Infinity,
  clicks: r => r.clicks ?? -Infinity};
function sorted(rows) {
  const key = SORT_KEYS[state.sort];
  return rows.slice().sort((a, b) => (key(b) > key(a)) - (key(b) < key(a)) || a.keyword.localeCompare(b.keyword));
}
function shownKinds(d) {
  // Product line and phase are hidden while every target has the same value (the site doesn't use them).
  const values = {};
  d.labels.forEach(l => (values[kindOf(l)] = values[kindOf(l)] || []).push(l));
  return Object.fromEntries(Object.entries(values).filter(([k, vs]) => !((k === "line" || k === "phase") && vs.length < 2)));
}
function draw() {
  const d = state.data, kinds = shownKinds(d);
  $("range").innerHTML = Object.entries(PRESETS).map(([k, v]) => `<option value="${k}"${k === state.range ? " selected" : ""}>${v}</option>`).join("");
  $("grpwrap").hidden = !d.groupings.length;
  $("grouping").innerHTML = d.groupings.map(g => `<option${g === d.grouping ? " selected" : ""}>${g}</option>`).join("");
  $("mv").value = state.movement; $("sort").value = state.sort;
  drawLabelFilter(kinds);
  $("note").textContent = (d.range
    ? `Search Console data from ${d.range.start} to ${d.range.end}` + (d.range.clamped ? ` (data from ${d.first_day}, so the range is shorter than requested)` : "") + ". Positions are impression-weighted."
    : "No Search Console data stored yet.") + ` Ads volume: ${state.volumeSource}. Clickstream: ${csLabel()}.`;
  drawChart(d); drawTable(d, kinds);
}
function drawLabelFilter(kinds) {
  $("lblwrap").innerHTML = Object.entries(kinds).map(([k, vs]) => `<span class="kind">${esc(k)}:` +
    vs.map(v => `<label><input type="checkbox" value="${esc(v)}"${state.labels.has(v) ? " checked" : ""}> ${esc(labelValue(v))}</label>`).join("") + `</span>`).join("");
  $("lblwrap").querySelectorAll("input").forEach(c => c.onchange = () => {
    c.checked ? state.labels.add(c.value) : state.labels.delete(c.value); load();
  });
}
// Journal markers (#31): a dashed vertical line at the graph point holding each entry (the API's `bucket`);
// red for an exact live date, amber for an approximate one; hover a line for the note.
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lineChart(canvas, points, label, entries) {
  const accent = cssVar("--accent"), exact = cssVar("--bad"), approx = cssVar("--warn");
  const starts = points.map(p => p.start);
  const marks = entries.map(e => ({e, i: starts.indexOf(e.bucket)})).filter(m => m.i >= 0);
  const tip = (ch, ev) => {
    const hit = marks.filter(m => Math.abs(ch.scales.x.getPixelForValue(m.i) - ev.offsetX) < 5);
    ch.canvas.title = hit.map(({e}) => `${e.live_date}${e.approx ? " (approx)" : ""} ${e.change_type}: ${e.page}${e.note ? " \u2013 " + e.note : ""}`).join("\n");
  };
  const markers = {id: "journal", afterDatasetsDraw(ch) {
    const {ctx, chartArea: area, scales: {x}} = ch;
    ctx.save(); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
    marks.forEach(m => { const px = x.getPixelForValue(m.i);
      ctx.strokeStyle = m.e.approx ? approx : exact;
      ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke(); });
    ctx.restore();
  }};
  return new Chart(canvas, {type: "line",
    data: {labels: starts, datasets: [{label, data: points.map(p => p.position),
      borderColor: accent, backgroundColor: accent, spanGaps: false, tension: 0.2, pointRadius: 2}]},
    options: {maintainAspectRatio: false, onHover: (ev, _a, ch) => tip(ch, ev), plugins: {legend: {display: false}},
      scales: {y: {reverse: true, title: {display: true, text: "Position"}}}},
    plugins: [markers]});
}
function markerNote(entries) {
  return entries.length ? ` Dashed lines mark journal entries (${entries.length}): red for an exact live date, amber for an approximate one; hover a line for details.` : "";
}
function drawChart(d) {
  if (chart) chart.destroy();
  chart = null;
  if (typeof Chart === "undefined") { showError("Chart library failed to load; the table below is still current."); return; }
  chart = lineChart($("ov"), d.overview, "Average position", d.journal);
  $("ovnote").textContent = markerNote(d.journal);
}
function drawTable(d, kinds) {
  const rows = sorted(d.rows);
  if (!rows.length) { $("tbl").innerHTML = `<div class="sub">No keyword targets match.</div>`; return; }
  const chips = r => r.labels.filter(l => kindOf(l) in kinds && kindOf(l) !== "folder")
    .map(l => `<span class="lbl" title="${esc(l)}">${esc(labelValue(l))}</span>`).join("");
  const showLabels = rows.some(r => chips(r));  // no column when every row's would be empty
  $("tbl").innerHTML = `<table><thead><tr><th>Keyword</th>${showLabels ? "<th>Labels</th>" : ""}<th class="n">Position now</th><th class="n">Movement</th>
    <th class="n">Period avg</th><th class="n" title="${esc(state.volumeSource)}">Ads volume</th><th class="n" title="${esc(csLabel())}">Clickstream<div class="sub">${esc(csDate())}</div></th><th class="n">Clicks</th><th>Top URL</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="rowlink" data-id="${r.id}" style="cursor:pointer"><td>${esc(r.keyword)}<div class="sub">${esc(r.path)}</div></td>
      ${showLabels ? `<td>${chips(r)}</td>` : ""}
      <td class="n">${r.no_data ? '<span class="sub">no data</span>' : pos(r.current)}</td><td class="n">${arrow(r)}</td>
      <td class="n">${pos(r.period_avg)}</td><td class="n">${num(r.volume)}</td>
      <td class="n">${num(r.clickstream_volume)}</td>
      <td class="n">${num(r.clicks)}</td>
      <td>${r.top_url ? esc(r.top_url) + (r.top_url_off_target ? ' <span class="off" title="Google ranks a different page than the target">off target</span>' : "") : "\u2013"}</td></tr>`).join("") + "</tbody></table>";
  $("tbl").querySelectorAll("tr.rowlink").forEach(tr => tr.onclick = () => openDetail(+tr.dataset.id));
}
let dchart = null, dcur = null;
const gscLabel = (g, what) => `${g.source} ${what}${g.as_of ? ", data to " + g.as_of : ""}`;
async function openDetail(id, scroll = true) {
  dcur = id;
  const p = new URLSearchParams({range: state.range});
  if (state.grouping) p.set("grouping", state.grouping);
  let r, d;
  try { r = await fetch(`api/rankings/${id}?` + p); d = await r.json().catch(() => ({})); }
  catch (e) { showError(`Detail failed to load: ${e.message}`); return; }
  if (!r.ok) { showError(d.detail || `Detail failed (${r.status})`); return; }
  drawDetail(d);
  if (scroll) $("detail").scrollIntoView({behavior: "smooth"});
}
function drawDetail(d) {
  const c = d.cards, box = $("detail");
  box.hidden = false;
  const card = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  box.innerHTML = `<div class="bar"><h2 style="margin:0">${esc(d.keyword)} <span class="sub">${esc(d.path)}</span></h2>
      <button class="ghost" id="dclose">Close</button></div>
    <div class="strip">${card(c.no_data ? "no data" : pos(c.current), "Position now")}${card(arrow(c), "Movement")}
      ${card(pos(c.period_avg), "Period average")}
      ${card(num(c.ads_volume), "Ads volume (" + esc(state.volumeSource) + ")")}
      ${card(num(c.clickstream_volume), "Clickstream volume (" + esc(csLabel(d.clickstream)) + ")")}
      ${card(num(c.impressions), gscLabel(d.gsc, "impressions (all close variants)"))}
      ${card(num(c.clicks), gscLabel(d.gsc, "clicks"))}</div>
    <div class="chart"><canvas id="dch"></canvas></div>
    <div class="sub">${markerNote(d.journal).trim()}</div>
    <h3>Free tags</h3>
    <div id="dtags">${d.tags.map(t => `<span class="lbl">${esc(t)} <a href="#" data-rm="${esc(t)}" title="Remove free tag">\u00d7</a></span>`).join("") || '<span class="sub">No free tags yet.</span>'}</div>
    <div class="bar" style="margin-top:6px"><input id="newtag" placeholder="Add a free tag, e.g. Services" list="taglist"><datalist id="taglist"></datalist><button id="addtag">Add</button></div>
    <h3>Close variants</h3>
    <table><thead><tr><th>Query</th><th class="n">Impressions</th><th class="n">Clicks</th><th class="n">Position</th></tr></thead><tbody>` +
    (d.variants.map(v => `<tr><td>${esc(v.query)}</td><td class="n">${v.impressions.toLocaleString()}</td><td class="n">${v.clicks.toLocaleString()}</td><td class="n">${pos(v.position)}</td></tr>`).join("")
      || `<tr><td colspan="4" class="sub">No queries in this range.</td></tr>`) + "</tbody></table>";
  $("dclose").onclick = () => { box.hidden = true; };
  if (dchart) dchart.destroy();
  dchart = null;
  if (typeof Chart === "undefined") return;
  dchart = lineChart($("dch"), d.series, "Position", d.journal);
  fetch("api/tags").then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.status);
    $("taglist").innerHTML = j.tags.map(t => `<option value="${esc(t)}">`).join("");
  }).catch(e => showError(`Free tag list failed to load: ${e.message}`));
  const edit = async (url, method, body) => {
    let r;
    try { r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)}); }
    catch (e) { showError(`Free tag change failed: ${e.message}`); return; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); showError(j.detail || `Free tag change failed (${r.status})`); return; }
    await load();  // redraws the list and the open detail
  };
  $("addtag").onclick = () => edit(`api/targets/${d.id}/tags`, "POST", {tag: $("newtag").value});
  $("newtag").onkeydown = e => { if (e.key === "Enter") $("addtag").click(); };
  box.querySelectorAll("[data-rm]").forEach(a => a.onclick = e => { e.preventDefault(); edit(`api/targets/${d.id}/tags/${encodeURIComponent(a.dataset.rm)}`, "DELETE"); });
}
$("range").onchange = e => { state.range = e.target.value; state.grouping = null; load(); };
$("grouping").onchange = e => { state.grouping = e.target.value; load(); };
$("mv").onchange = e => { state.movement = e.target.value; load(); };
$("sort").onchange = e => { state.sort = e.target.value; drawTable(state.data, shownKinds(state.data)); };
loadVolumeSource().then(load);
</script>
</body>
</html>
