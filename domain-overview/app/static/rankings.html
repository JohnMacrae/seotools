<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { --accent-bg: #fff3a8; --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec; --accent: #2f6fde; --bad: #d64545; --radius: 10px;
    --on-accent: #fff; --bad-bg: #fdeaea; --bad-line: #f3c2c2; --bad-ink: #8a1f1f; --subtle: #eef0f4;
    color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --card: #1b2029; --ink: #e4e7ee; --muted: #9aa3b5; --line: #2c3340; --accent: #6b9cf0; --bad: #f07171; --on-accent: #0b1220; --bad-bg: #3a1f22; --bad-line: #5c2a2e; --bad-ink: #f3b0b0; --subtle: #252b36; --accent-bg: #1f2c45;  } }

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .top { display: flex; gap: 18px; align-items: center; }
  .top h1 { font-size: 16px; margin: 0; }
  nav a { color: var(--muted); margin-right: 14px; text-decoration: none; } nav a.on { color: var(--ink); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; overflow-x: auto; }
  input, button, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--card); color: var(--ink); }
  button { background: var(--accent); color: var(--on-accent); border-color: var(--accent); cursor: pointer; }
  button.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  button.del { background: var(--card); color: var(--bad); border-color: var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td input, td textarea { width: 100%; } td textarea { height: 64px; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .err { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { background: var(--card); color: var(--ink); border-color: var(--line); } .tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .strip { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); white-space: nowrap; font-weight: 400; }
  .lm h3 { margin: 0 0 4px; font-size: 14px; } .lm p { margin: 4px 0; }
  .lm summary { cursor: pointer; color: var(--muted); margin: 8px 0 4px; }
  .st-done { color: #2e8b57; } .st-bad { color: var(--bad); } .st-existing { color: var(--muted); }
  th.sort { cursor: pointer; }
  mark { background: var(--accent-bg, #fff3a8); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .sup { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .sup li { margin: 6px 0; } .sup .btns { white-space: nowrap; }
  .sup button { padding: 2px 8px; font-size: 12px; }
  code { background: var(--subtle); padding: 0 4px; border-radius: 4px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.on { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent); }
  .badge.off { background: var(--subtle); color: var(--muted); border: 1px solid var(--line); }
  td.n, th.n { text-align: right; } .neg { color: var(--bad); } h2 { font-size: 15px; margin: 0 0 6px; } h3 { font-size: 14px; margin: 14px 0 4px; }
  details { border-top: 1px solid var(--line, #e5e5e5); padding: 6px 0; } summary { cursor: pointer; } details table { margin: 6px 0 10px; }
  table.sortable th { cursor: pointer; }
  table.sortable th[data-dir="asc"]::after { content: " ▲"; }
  table.sortable th[data-dir="desc"]::after { content: " ▼"; }

  .chart { position: relative; height: 280px; }
  .up { color: #2e8b57; font-weight: 600; } .down { color: var(--bad); font-weight: 600; } .flat { color: var(--muted); }
  th.sort { cursor: pointer; } th.sort.on { color: var(--ink); }
  td.n, th.n { text-align: right; }
  .lbl { display: inline-block; font-size: 11px; padding: 0 6px; margin: 0 4px 2px 0; border-radius: 8px; background: var(--subtle); color: var(--muted); }
  .off { color: var(--bad); }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="top"><h1>SEO tools</h1><nav><a href="./">Domain overview</a><a href="compare">Competitor gap</a><a href="linking">Internal linking</a><a href="rankings" class="on">Rankings</a><a href="journal">Journal</a><a href="targets">Keyword targets</a><a href="mappack">Map pack</a><a href="digest">Digest</a></nav></div>
</header>
<main>
  <div id="err"></div>
  <div class="bar">
    <label>Range <select id="range"></select></label>
    <label id="grpwrap">Group by <select id="grouping"></select></label>
    <label>Show <select id="mv"><option value="all">All movement</option><option value="up">Moved up</option><option value="down">Moved down</option></select></label>
    <label>Sort <select id="sort">
      <option value="moved">Most moved</option><option value="top">Top ranks</option>
      <option value="volume">Ads volume</option><option value="clicks">Clicks</option></select></label>
    <span id="lblwrap"></span>
  </div>
  <div class="sub" id="note" style="margin-bottom:10px"></div>
  <div class="card"><h2 style="margin:0 0 6px;font-size:15px">Average position of the targets <span class="sub">(lower is better; gaps = no data)</span></h2>
    <div class="chart"><canvas id="ov"></canvas></div></div>
  <div class="card"><div id="tbl"></div></div>
  <div class="card" id="detail" hidden></div>
</main>
<script src="spendlight.js"></script>
<script src="sitemenu.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const PRESETS = {all:"All data","12m":"12 months","6m":"6 months","3m":"3 months","30d":"30 days","12w":"12 weeks","7d":"7 days"};
const VOLUME_LABEL = "Google Ads UK monthly, from the targets doc (locked 2026-11-07)";
const st = {range: "3m", grouping: null, movement: "all", sort: "moved", labels: new Set(), data: null};
let chart = null;
const pos = n => n == null ? "\u2013" : n.toFixed(1);

function query() {
  const p = new URLSearchParams({range: st.range, movement: st.movement});
  if (st.grouping) p.set("grouping", st.grouping);
  st.labels.forEach(l => p.append("labels", l));
  return p;
}
async function load() {
  $("err").innerHTML = "";
  const r = await fetch("api/rankings?" + query());
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("err").innerHTML = `<div class="err">${esc(j.detail || r.status)}</div>`; return; }
  st.data = j; st.grouping = j.grouping; draw();
}
function arrow(row) {
  if (row.direction == null) return `<span class="flat">\u2013</span>`;
  if (row.direction === "flat") return `<span class="flat">\u2192 0.0</span>`;
  // movement = start - current: positive means the position number fell, which is better.
  const up = row.direction === "up";
  return `<span class="${up ? "up" : "down"}">${up ? "\u25B2" : "\u25BC"} ${Math.abs(row.movement).toFixed(1)}</span>`;
}
function sorted(rows) {
  const k = st.sort, by = {
    moved: r => r.movement == null ? -1 : Math.abs(r.movement),
    top: r => r.current == null ? 1e9 : -r.current,
    volume: r => r.volume ?? -1, clicks: r => r.clicks};
  return rows.slice().sort((a, b) => by[k](b) - by[k](a) || a.keyword.localeCompare(b.keyword));
}
function draw() {
  const d = st.data;
  $("range").innerHTML = Object.entries(PRESETS).map(([k, v]) => `<option value="${k}"${k === st.range ? " selected" : ""}>${v}</option>`).join("");
  $("grpwrap").hidden = !d.groupings.length;
  $("grouping").innerHTML = d.groupings.map(g => `<option${g === d.grouping ? " selected" : ""}>${g}</option>`).join("");
  $("mv").value = st.movement; $("sort").value = st.sort;
  drawLabels(d);
  $("note").textContent = d.range
    ? `Search Console data from ${d.range.start} to ${d.range.end}` + (d.range.clamped ? ` (earliest stored data is ${d.first_day}, so the range is shorter than requested)` : "") + ". Positions are impression-weighted."
    : "No Search Console data stored yet.";
  drawChart(d); drawTable(d);
}
function drawLabels(d) {
  // Product line and phase labels are hidden while every target has the same one (unused).
  const kinds = {};
  d.labels.forEach(l => { const [k, v] = [l.split(":")[0], l]; (kinds[k] = kinds[k] || []).push(v); });
  const show = Object.entries(kinds).filter(([k, vs]) => !((k === "line" || k === "phase") && vs.length < 2));
  $("lblwrap").innerHTML = show.map(([k, vs]) => `<label>${esc(k)} <select data-kind="${k}" multiple size="1" style="min-width:90px">` +
    vs.map(v => `<option value="${esc(v)}"${st.labels.has(v) ? " selected" : ""}>${esc(v.slice(k.length + 1))}</option>`).join("") + `</select></label>`).join("");
  $("lblwrap").querySelectorAll("select").forEach(s => s.onchange = () => {
    [...s.options].forEach(o => o.selected ? st.labels.add(o.value) : st.labels.delete(o.value)); load();
  });
}
function drawChart(d) {
  if (chart) chart.destroy();
  chart = new Chart($("ov"), {type: "line",
    data: {labels: d.overview.map(p => p.start), datasets: [{label: "Average position", data: d.overview.map(p => p.position),
      borderColor: "#2f6fde", backgroundColor: "#2f6fde", spanGaps: false, tension: 0.2, pointRadius: 2}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {y: {reverse: true, title: {display: true, text: "Position"}}}}});
}
function drawTable(d) {
  const rows = sorted(d.rows);
  const hasLbl = r => r.labels.filter(l => !/^(line|phase|folder):/.test(l) || (d.labels.filter(x => x.startsWith(l.split(":")[0] + ":")).length > 1));
  if (!rows.length) { $("tbl").innerHTML = `<div class="sub">No keyword targets match.</div>`; return; }
  $("tbl").innerHTML = `<table><thead><tr><th>Keyword</th><th>Labels</th><th class="n">Position now</th><th class="n">Movement</th>
    <th class="n">Period avg</th><th class="n" title="${esc(VOLUME_LABEL)}">Ads volume<br><span class="sub">${esc(VOLUME_LABEL)}</span></th><th class="n">Clicks</th><th>Top URL</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="rowlink" data-id="${r.id}" style="cursor:pointer"><td>${esc(r.keyword)}<div class="sub">${esc(r.path)}</div></td>
      <td>${hasLbl(r).map(l => `<span class="lbl">${esc(l)}</span>`).join("")}</td>
      <td class="n">${r.no_data ? '<span class="sub">no data</span>' : pos(r.current)}</td><td class="n">${arrow(r)}</td>
      <td class="n">${pos(r.period_avg)}</td><td class="n">${r.volume == null ? "\u2013" : r.volume.toLocaleString()}</td>
      <td class="n">${r.clicks.toLocaleString()}</td>
      <td>${r.top_url ? esc(r.top_url) + (r.top_url_off_target ? ' <span class="off" title="Google ranks a different page than the target">off target</span>' : "") : "\u2013"}</td></tr>`).join("") + "</tbody></table>";
  $("tbl").querySelectorAll("tr.rowlink").forEach(tr => tr.onclick = () => openDetail(+tr.dataset.id));
}
let dchart = null, dcur = null;
async function openDetail(id) {
  dcur = id;
  const p = new URLSearchParams({range: st.range});
  if (st.grouping) p.set("grouping", st.grouping);
  const r = await fetch(`api/rankings/${id}?` + p);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("err").innerHTML = `<div class="err">${esc(d.detail || r.status)}</div>`; return; }
  drawDetail(d);
  $("detail").scrollIntoView({behavior: "smooth"});
}
function drawDetail(d) {
  const c = d.cards, box = $("detail");
  box.hidden = false;
  const card = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  box.innerHTML = `<div class="bar"><h2 style="margin:0">${esc(d.keyword)} <span class="sub">${esc(d.path)}</span></h2>
      <button class="ghost" id="dclose">Close</button></div>
    <div class="strip">${card(c.no_data ? "no data" : pos(c.current), "Position now")}${card(arrow(c), "Movement")}
      ${card(pos(c.period_avg), "Period average")}
      ${card(c.ads_volume == null ? "\u2013" : c.ads_volume.toLocaleString(), "Ads volume (" + esc(VOLUME_LABEL) + ")")}
      ${card(c.impressions.toLocaleString(), "Search Console impressions (all close variants)")}
      ${card(c.clicks.toLocaleString(), "Clicks")}</div>
    <div class="chart"><canvas id="dch"></canvas></div>
    <h3>Tags</h3>
    <div id="dtags">${d.tags.map(t => `<span class="lbl">${esc(t)} <a href="#" data-rm="${esc(t)}" title="Remove tag">\u00d7</a></span>`).join("") || '<span class="sub">No tags yet.</span>'}</div>
    <div class="bar" style="margin-top:6px"><input id="newtag" placeholder="Add a tag, e.g. Services" list="taglist"><datalist id="taglist"></datalist><button id="addtag">Add</button></div>
    <h3>Close variants</h3>
    <table><thead><tr><th>Query</th><th class="n">Impressions</th><th class="n">Clicks</th><th class="n">Position</th></tr></thead><tbody>` +
    (d.variants.map(v => `<tr><td>${esc(v.query)}</td><td class="n">${v.impressions.toLocaleString()}</td><td class="n">${v.clicks.toLocaleString()}</td><td class="n">${pos(v.position)}</td></tr>`).join("")
      || `<tr><td colspan="4" class="sub">No queries in this range.</td></tr>`) + "</tbody></table>";
  $("dclose").onclick = () => { box.hidden = true; };
  if (dchart) dchart.destroy();
  dchart = new Chart($("dch"), {type: "line",
    data: {labels: d.series.map(p => p.start), datasets: [{label: "Position", data: d.series.map(p => p.position),
      borderColor: "#2f6fde", backgroundColor: "#2f6fde", spanGaps: false, tension: 0.2, pointRadius: 2}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {y: {reverse: true, title: {display: true, text: "Position"}}}}});
  fetch("api/tags").then(r => r.json()).then(j => { $("taglist").innerHTML = j.tags.map(t => `<option value="${esc(t)}">`).join(""); });
  const edit = async (url, method, body) => {
    const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
    if (!r.ok) { const j = await r.json().catch(() => ({})); $("err").innerHTML = `<div class="err">${esc(j.detail || r.status)}</div>`; return; }
    await load(); openDetail(d.id);
  };
  $("addtag").onclick = () => edit(`api/targets/${d.id}/tags`, "POST", {tag: $("newtag").value});
  $("newtag").onkeydown = e => { if (e.key === "Enter") $("addtag").click(); };
  box.querySelectorAll("[data-rm]").forEach(a => a.onclick = e => { e.preventDefault(); edit(`api/targets/${d.id}/tags/${encodeURIComponent(a.dataset.rm)}`, "DELETE"); });
}
$("range").onchange = e => { st.range = e.target.value; st.grouping = null; load(); };
$("grouping").onchange = e => { st.grouping = e.target.value; load(); };
$("mv").onchange = e => { st.movement = e.target.value; load(); };
$("sort").onchange = e => { st.sort = e.target.value; drawTable(st.data); };
load();
</script>
</body>
</html>
