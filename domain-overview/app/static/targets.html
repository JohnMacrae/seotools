<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword targets</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec; --accent: #2f6fde; --bad: #d64545; --radius: 10px;
    --on-accent: #fff; --bad-bg: #fdeaea; --bad-line: #f3c2c2; --bad-ink: #8a1f1f; --subtle: #eef0f4;
    color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --card: #1b2029; --ink: #e4e7ee; --muted: #9aa3b5; --line: #2c3340; --accent: #6b9cf0; --bad: #f07171; --on-accent: #0b1220; --bad-bg: #3a1f22; --bad-line: #5c2a2e; --bad-ink: #f3b0b0; --subtle: #252b36; --accent-bg: #1f2c45;  } }

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .top { display: flex; gap: 18px; align-items: center; }
  .top h1 { font-size: 16px; margin: 0; }
  nav a { color: var(--muted); margin-right: 14px; text-decoration: none; } nav a.on { color: var(--ink); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; overflow-x: auto; }
  input, button, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--card); color: var(--ink); }
  button { background: var(--accent); color: var(--on-accent); border-color: var(--accent); cursor: pointer; }
  button.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  button.del { background: var(--card); color: var(--bad); border-color: var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td input, td textarea { width: 100%; } td textarea { height: 64px; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .err { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  code { background: var(--subtle); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>SEO tools</h1><nav><a href="./">Domain overview</a><a href="compare">Competitor gap</a><a href="linking">Internal linking</a><a href="targets" class="on">Keyword targets</a><a href="mappack">Map pack</a></nav></div>
</header>
<main>
  <div id="err"></div>
  <div class="card">
    <div class="bar">
      <button id="seed">Seed from doc</button>
      <button id="add" class="ghost">Add target</button>
      <span class="sub" id="msg">Curated, not inferred (ADR 0001). Seeding refreshes untouched rows and keeps rows you have edited.</span>
    </div>
    <table id="t"></table>
  </div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let rows = [], editing = null;
const TIPS = {
  "#": "Row key from docs/keyword-targets.md.",
  "Target page": "Page meant to rank; \"(new)\" = not built yet.",
  "Primary keyword": "Main keyword the page should rank for.",
  "Supporting keywords": "Related keywords the same page should also cover.",
  "Volume": "Monthly searches for the primary keyword (from the targets doc).",
  "Win basis": "What counts as winning this keyword; \"(edited)\" = changed here.",
  "Phase": "Rollout phase (1 = bridal now).",
  "Line": "Product line: bridal, bridesmaids or MOB."
};
const tip = k => TIPS[k] ? ` title="${esc(TIPS[k])}"` : "";

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}
const wrap = fn => async (...a) => { try { document.getElementById("err").innerHTML = ""; await fn(...a); } catch (e) { document.getElementById("err").innerHTML = `<div class="err">${esc(e.message)}</div>`; } };

async function load() { rows = await api("GET", "/api/targets"); render(); }

function render() {
  const head = `<tr><th${tip("#")}>#</th><th${tip("Target page")}>Target page</th><th${tip("Primary keyword")}>Primary keyword</th><th${tip("Supporting keywords")}>Supporting keywords</th><th${tip("Volume")}>Volume</th><th${tip("Win basis")}>Win basis</th><th${tip("Phase")}>Phase</th><th${tip("Line")}>Line</th><th></th></tr>`;
  const body = rows.map(r => editing === r.id ? editRow(r) : `<tr>
    <td>${r.seed_key ?? ""}</td><td><code>${esc(r.path)}</code>${r.is_new ? ' <span class="sub">(new)</span>' : ""}</td>
    <td>${esc(r.primary_keyword)}</td><td>${esc(r.supporting.join("; "))}</td>
    <td>${r.volume == null ? "" : r.volume.toLocaleString()}</td><td>${esc(r.win_basis)}${r.edited ? ' <span class="sub">(edited)</span>' : ""}</td>
    <td>${r.phase}</td><td>${esc(r.product_line)}</td>
    <td><button class="ghost" onclick="edit(${r.id})">Edit</button> <button class="del" onclick="del(${r.id})">Delete</button></td></tr>`).join("");
  document.getElementById("t").innerHTML = head + (editing === 0 ? editRow({id: 0, path: "", primary_keyword: "", supporting: [], volume: "", win_basis: "", phase: 1, product_line: "bridal", is_new: 0}) : "") + body;
}
function editRow(r) {
  return `<tr><td></td><td><input id="f_path" value="${esc(r.path)}"><label class="sub"><input type="checkbox" id="f_new" style="width:auto" ${r.is_new ? "checked" : ""}> new page</label></td>
    <td><input id="f_primary_keyword" value="${esc(r.primary_keyword)}"></td>
    <td><textarea id="f_supporting" title="one per line">${esc(r.supporting.join("\n"))}</textarea></td>
    <td><input id="f_volume" type="number" value="${esc(r.volume)}"></td><td><input id="f_win_basis" value="${esc(r.win_basis)}"></td>
    <td><input id="f_phase" type="number" value="${r.phase}" style="width:60px"></td><td><input id="f_product_line" value="${esc(r.product_line)}"></td>
    <td><button onclick="save(${r.id})">Save</button> <button class="ghost" onclick="editing=null;render()">Cancel</button></td></tr>`;
}
const v = id => document.getElementById("f_" + id).value;
window.edit = id => { editing = id; render(); };
window.save = wrap(async id => {
  const body = {path: v("path").trim(), primary_keyword: v("primary_keyword").trim(),
    supporting: v("supporting").split("\n").map(s => s.trim()).filter(Boolean),
    volume: v("volume") === "" ? null : Number(v("volume")), win_basis: v("win_basis"),
    phase: Number(v("phase")) || 1, product_line: v("product_line") || "bridal", is_new: document.getElementById("f_new").checked ? 1 : 0};
  await (id ? api("PUT", `/api/targets/${id}`, body) : api("POST", "/api/targets", body));
  editing = null; await load();
});
window.del = wrap(async id => { if (confirm("Delete this target?")) { await api("DELETE", `/api/targets/${id}`); await load(); } });
document.getElementById("add").onclick = () => { editing = 0; render(); };
document.getElementById("seed").onclick = wrap(async () => {
  const r = await api("POST", "/api/targets/seed");
  document.getElementById("msg").textContent = `Seeded: ${r.added} added, ${r.updated} refreshed, ${r.kept_edited} kept (edited).`;
  await load();
});
wrap(load)();
</script>
</body>
</html>
