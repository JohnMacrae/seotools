services:
  domain-overview:
    build: .
    container_name: domain-overview
    restart: unless-stopped
    env_file: .env
    ports:
      - "8095:8000"
    volumes:
      - ./data:/data
      - ../docs:/docs:ro
      - /volume1/docker/serenity/sweb-live/data/bl/ga4-service-account.json:/secrets/gsc-key.json:ro

  # Test runner: `docker compose run --rm tests` (not started by `up`)
  tests:
    image: python:3.12-slim
    profiles: ["test"]
    working_dir: /srv
    volumes:
      - .:/srv
      - ../docs:/docs:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: sh -c "pip install -q --root-user-action=ignore -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider tests"
